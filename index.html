<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Reset and basic settings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: none; /* hide default cursor */
    }
    /* Centered main text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    /* Vanish animation when clicked */
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s infinite;
      z-index: 1000;
    }
    @keyframes pulse {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
      50%  { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    }
    /* Overlay for explosion effect */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* will be activated on click */
      align-items: center;
      justify-content: center;
      z-index: 2000;
      pointer-events: none;
      /* Start as a tiny circle at the click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    /* When activated, run the eruption animation */
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from {
        clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
      }
      to {
        clip-path: circle(150% at var(--x, 50%) var(--y, 50%));
      }
    }
    /* Overlay text that fades in after eruption */
    #overlay-text {
      font-size: 20px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
      animation-delay: 0.8s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Main clickable text -->
  <div id="text">Basil Alomary</div>
  
  <!-- Custom cursor element -->
  <div id="custom-cursor"></div>
  
  <!-- Fullscreen overlay that will erupt on click -->
  <div id="overlay">
    <div id="overlay-text">We'll be back soon</div>
  </div>
  
  <script>
    // Update the custom cursor to follow the mouse
    document.addEventListener("mousemove", function(e) {
      const cursor = document.getElementById("custom-cursor");
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    
    // When the main text is clicked…
    document.getElementById("text").addEventListener("click", function(e) {
      // Start the vanish animation on the text
      this.classList.add("clicked");
      
      // Get the click coordinates
      const x = e.clientX;
      const y = e.clientY;
      
      // Get the overlay element and set its clip-path center via CSS variables
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", x + "px");
      overlay.style.setProperty("--y", y + "px");
      
      // Display the overlay (using flex to center the message)
      overlay.style.display = "flex";
      
      // Hide the custom cursor so it does not appear on top of the explosion
      document.getElementById("custom-cursor").style.display = "none";
      
      // Force reflow so the animation restarts
      void overlay.offsetWidth;
      
      // Add the "active" class to trigger the eruption animation
      overlay.classList.add("active");
    });
  </script>
</body>
</html>
