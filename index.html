<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global Reset & Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
    }
    /* Main Text (BASIL ALOMARY) */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom Cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1000;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50%  { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    /* Overlay for Explosion Effect */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      pointer-events: none;
      /* Start as a tiny circle at click/touch point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Overlay Text – Your Bio/Description */
    #overlay-text {
      font-size: 16px;
      color: #000;
      max-width: 80%;
      text-align: center;
      line-height: 1.5;
    }
    /* Style links inside the description */
    #overlay-text a {
      color: #000;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main Text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom Cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion Overlay -->
  <div id="overlay">
    <div id="overlay-text"></div>
  </div>
  
  <script>
    /********************
     * Text Scramble Effect
     ********************/
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.frameRequest = null;
        this.frame = 0;
        this.queue = [];
        this.resolve = null;
        // Lower multiplier for a faster scramble effect.
        this.multiplier = 2; 
        this.update = this.update.bind(this);
      }
      
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          // Use the reduced multiplier for faster start and end times.
          const start = Math.floor(Math.random() * 40 * this.multiplier);
          const end = start + Math.floor(Math.random() * 40 * this.multiplier);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0; i < this.queue.length; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span class="dud">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    /********************
     * Custom Cursor Positioning
     ********************/
    const cursor = document.getElementById("custom-cursor");
    document.addEventListener("mousemove", e => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    
    /********************
     * Click / Touch: Trigger Explosion & Scramble Bio
     ********************/
    document.getElementById("text").addEventListener("click", triggerAnimation);
    document.getElementById("text").addEventListener("touchstart", triggerAnimation);
    
    function triggerAnimation(e) {
      // Prevent multiple triggers
      const textEl = document.getElementById("text");
      if (textEl.classList.contains("clicked")) return;
      
      textEl.classList.add("clicked");
      
      // Get click/touch coordinates
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Set overlay explosion origin and display it
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      
      // Hide the custom cursor
      cursor.style.display = "none";
      
      // Restart explosion animation
      void overlay.offsetWidth;
      overlay.classList.add("active");
      
      // Set the bio/description text with hyperlinks (HTML is preserved)
      const bioText = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://www.bain.com" target="_blank">Bain &amp; Company</a> and as the VP of Growth at <a href="https://www.simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
      
      const overlayText = document.getElementById("overlay-text");
      const scramble = new TextScramble(overlayText);
      scramble.setText(bioText);
    }
  </script>
</body>
</html>
