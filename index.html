<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BASIL ALOMARY</title>
  <!-- Google Font: Inter (similar to michaelg.fr) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 1rem;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    p.description {
      font-size: 1rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }
    ul.links {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    ul.links li {
      margin: 1.25rem 0;
    }
    ul.links a {
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
      transition: color 0.2s;
    }
    ul.links a:hover {
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main heading with text scramble effect -->
    <h1 id="scrambleText">BASIL ALOMARY</h1>
    <!-- Brief description directly below the name -->
    <p class="description">
      Investor. Strategist. Writer.
      Building ideas that transform industries.
    </p>
    <!-- Personal links -->
    <ul class="links">
      <li><a href="https://www.linkedin.com/in/basilalomary" target="_blank">LinkedIn</a></li>
      <li><a href="https://twitter.com/basil_alomary" target="_blank">Twitter</a></li>
      <li><a href="https://medium.com/@basil.a.alomary" target="_blank">Writing</a></li>
      <li><a href="mailto:basil@alomary.com" target="_blank">Contact</a></li>
    </ul>
  </div>

  <script>
    /***** TEXT SCRAMBLE EFFECT *****/
    // A TextScramble class adapted for a minimal effect
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.update = this.update.bind(this);
      }
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          const start = Math.floor(Math.random() * 40);
          const end = start + Math.floor(Math.random() * 40);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0, n = this.queue.length; i < n; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span style="opacity:0.8">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }

    // Start the scramble effect on the main heading
    const scrambleEl = document.getElementById('scrambleText');
    const fx = new TextScramble(scrambleEl);
    fx.setText('BASIL ALOMARY');
  </script>
</body>
</html>
