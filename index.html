<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- Include GSAP (for the explosion effect) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* Global reset and base styling */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    /* Main "BASIL ALOMARY" text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1500;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff; /* initially white */
      border-radius: 50%;
      border: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2000;
    }
    /* Explosion overlay covering full viewport */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* shown on explosion */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      /* Start as a tiny circle at the click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Bio text container – centered but with left-aligned text, very small font */
    #overlay-content {
      position: relative;
      max-width: 600px;
      width: 90%;
      margin: 0 auto;
      text-align: left;
      font-size: 10px;
      line-height: 1.4;
      color: #000;
    }
    /* Normal bio text layer (where typewriter effect happens) */
    #overlay-normal {
      pointer-events: auto;
    }
    #overlay-normal a {
      color: inherit;
      text-decoration: underline;
    }
    /* Blinking cursor style for typewriter effect */
    .cursor {
      display: inline-block;
      width: 2px;
      background: currentColor;
      animation: blink 1s step-end infinite;
      vertical-align: bottom;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Main clickable text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom pulsing cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion overlay -->
  <div id="overlay">
    <div id="overlay-content">
      <div id="overlay-normal"></div>
    </div>
  </div>
  
  <script>
    /********************
     * GLOBAL VARIABLES & BIO TEXT
     ********************/
    const bioHTML = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://bain.com" target="_blank">Bain</a> and as the VP of Growth at <a href="https://simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
    
    // For the typewriter effect, we want to process the HTML string,
    // treating tags (e.g. <a ...>) as atomic units.
    
    /********************
     * TYPEWRITER EFFECT FUNCTION
     ********************/
    function typeWriterEffect(element, text, index = 0, output = "") {
      if (index >= text.length) {
        // Remove the blinking cursor at the end (optional)
        element.innerHTML = output;
        return;
      }
      // If the current character begins an HTML tag, append the entire tag at once.
      if (text[index] === "<") {
        let closeIndex = text.indexOf(">", index);
        if (closeIndex === -1) closeIndex = index;
        output += text.substring(index, closeIndex + 1);
        element.innerHTML = output + '<span class="cursor">|</span>';
        setTimeout(() => typeWriterEffect(element, text, closeIndex + 1, output), randomDelay());
      } else {
        output += text.charAt(index);
        element.innerHTML = output + '<span class="cursor">|</span>';
        setTimeout(() => typeWriterEffect(element, text, index + 1, output), randomDelay());
      }
    }
    
    function randomDelay() {
      // Return a delay between 50ms and 200ms to mimic irregular typing.
      return 50 + Math.random() * 150;
    }
    
    /********************
     * CUSTOM PULSING CURSOR (for overall page)
     * - Slower pulsing (3-second period) with dynamic scaling based on distance from center.
     ********************/
    const cursor = document.getElementById("custom-cursor");
    let cursorX = 0, cursorY = 0;
    let startTime = performance.now();
    const minScale = 0.5, maxScale = 2.5;
    const pulsePeriod = 3; // seconds
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const dx = cursorX - centerX;
      const dy = cursorY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const maxDistance = Math.sqrt(centerX * centerX + centerY * centerY);
      const normalizedDistance = distance / maxDistance; // 0 at center, 1 at corner
      const baseScale = minScale + (maxScale - minScale) * (1 - normalizedDistance);
      const pulse = 0.5 * (Math.sin((2 * Math.PI / pulsePeriod) * elapsed) + 1);
      const finalScale = baseScale * (1 + 0.3 * pulse);
      cursor.style.transform = `translate(-50%, -50%) scale(${finalScale})`;
      requestAnimationFrame(animateCursor);
    }
    
    // Update cursor position on mouse/touch events
    document.addEventListener("mousemove", e => {
      cursorX = e.clientX;
      cursorY = e.clientY;
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursorX = e.touches[0].clientX;
      cursorY = e.touches[0].clientY;
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    animateCursor();
    
    /********************
     * EXPLOSION & TYPEWRITER ANIMATION
     ********************/
    const textEl = document.getElementById("text");
    textEl.addEventListener("click", triggerExplosion);
    textEl.addEventListener("touchstart", triggerExplosion);
    
    function triggerExplosion(e) {
      if (textEl.classList.contains("clicked")) return;
      textEl.classList.add("clicked");
      
      // Get click/touch coordinates
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Activate explosion overlay
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      void overlay.offsetWidth; // force reflow
      overlay.classList.add("active");
      
      // Change the custom cursor to solid black
      cursor.style.background = "#000";
      
      // Clear the normal bio text container and start typewriter effect
      const overlayNormal = document.getElementById("overlay-normal");
      overlayNormal.innerHTML = "";
      typeWriterEffect(overlayNormal, bioHTML);
    }
  </script>
</body>
</html>
