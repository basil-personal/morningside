<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Basic reset and settings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: none; /* hide default cursor */
    }
    /* Main clickable text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    /* Fade-out animation for the main text */
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s infinite;
      z-index: 1000;
    }
    @keyframes pulse {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
      50%  { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    }
    /* Overlay for the eruption effect */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none;  /* initially hidden */
      align-items: center;
      justify-content: center;
      z-index: 2000;
      pointer-events: none;
      /* Start as a tiny circle at the click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    /* When activated, run the eruption animation */
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from {
        clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
      }
      to {
        clip-path: circle(150% at var(--x, 50%) var(--y, 50%));
      }
    }
    /* Overlay text – bold and all caps */
    #overlay-text {
      font-size: 20px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }
    /* Optional style for scrambled (dud) characters */
    .dud {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- Main clickable text -->
  <div id="text">Basil Alomary</div>
  
  <!-- Custom cursor element -->
  <div id="custom-cursor"></div>
  
  <!-- Fullscreen overlay that erupts on click -->
  <div id="overlay">
    <div id="overlay-text"></div>
  </div>
  
  <script>
    // --------------------------
    // Text scramble effect class
    // --------------------------
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.frameRequest = null;
        this.frame = 0;
        this.queue = [];
        this.resolve = null;
        // Multiplier to slow down the scramble timings.
        this.multiplier = 5; 
        this.update = this.update.bind(this);
      }
      
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          // Random start and end times, multiplied to extend duration.
          const start = Math.floor(Math.random() * 40 * this.multiplier);
          const end = start + Math.floor(Math.random() * 40 * this.multiplier);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0; i < this.queue.length; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span class="dud">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    // -------------------------------------
    // Update custom cursor to follow mouse
    // -------------------------------------
    document.addEventListener("mousemove", function(e) {
      const cursor = document.getElementById("custom-cursor");
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    
    // --------------------------------------------------
    // On click: vanish main text, erupt overlay, and run scramble
    // --------------------------------------------------
    document.getElementById("text").addEventListener("click", function(e) {
      this.classList.add("clicked");
      
      // Get the click coordinates for the eruption origin.
      const x = e.clientX;
      const y = e.clientY;
      
      // Setup the overlay and its clip-path center.
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", x + "px");
      overlay.style.setProperty("--y", y + "px");
      overlay.style.display = "flex";
      
      // Hide the custom cursor.
      document.getElementById("custom-cursor").style.display = "none";
      
      // Force reflow so the eruption animation restarts.
      void overlay.offsetWidth;
      overlay.classList.add("active");
      
      // Trigger the scramble effect on the overlay text.
      const overlayText = document.getElementById("overlay-text");
      const scramble = new TextScramble(overlayText);
      scramble.setText("WE'LL BE BACK SOON");
      
      // After 10 seconds, fade out the overlay and open LinkedIn in a new tab.
      setTimeout(() => {
        overlay.style.transition = "opacity 0.5s ease";
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
          window.open("https://www.linkedin.com/in/basilalomary", "_blank");
        }, 500);
      }, 10000);
    });
  </script>
</body>
</html>
