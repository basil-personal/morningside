<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASIL ALOMARY</title>
  <!-- Google Font: Inter (inspired by michaelg.fr) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }
    .section {
      margin: 2rem 0;
    }
    a {
      color: #fff;
      text-decoration: none;
      position: relative;
    }
    a:hover {
      text-decoration: underline;
    }
    /* Tooltip for hyperlink preview (inspired by daniels.link) */
    .tooltip {
      position: fixed;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.9);
      color: #000;
      font-size: 0.875rem;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 1000;
    }
    .tooltip.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    /* Minimal content styling */
    .content {
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .content.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main heading with text scramble effect -->
    <h1 id="scrambleText">BASIL ALOMARY</h1>
    
    <!-- Example sections -->
    <div class="section">
      <p class="content" id="aboutText">
        Principal, Head of Research &amp; Growth Strategy at 
        <a href="https://www.stripes.co" target="_blank">Stripes</a>. 
        Previously: Consultant at 
        <a href="https://www.bain.com" target="_blank">Bain &amp; Company</a> and VP of Growth at 
        <a href="https://www.simondata.com" target="_blank">Simon Data</a>.
      </p>
    </div>
    <div class="section">
      <p class="content" id="writingText">
        Writing: Read articles on Forbes, Medium, and more.
      </p>
    </div>
    <div class="section">
      <p class="content" id="contactText">
        Contact: 
        <a href="https://www.linkedin.com/in/basilalomary" target="_blank">LinkedIn</a> | 
        <a href="https://twitter.com/basil_alomary" target="_blank">Twitter</a>
      </p>
    </div>
  </div>
  
  <!-- Tooltip element for hyperlink preview -->
  <div class="tooltip" id="linkTooltip"></div>
  
  <script>
    /***** TEXT SCRAMBLE EFFECT *****/
    // Adapted from a popular TextScramble implementation
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.update = this.update.bind(this);
      }
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          const start = Math.floor(Math.random() * 40);
          const end = start + Math.floor(Math.random() * 40);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0, n = this.queue.length; i < n; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span style="opacity:0.8">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    // Apply scramble effect on the main heading
    const scrambleEl = document.getElementById('scrambleText');
    const fx = new TextScramble(scrambleEl);
    fx.setText('BASIL ALOMARY').then(() => {
      // Once the text scramble completes, reveal the content sections
      document.querySelectorAll('.content').forEach(el => el.classList.add('visible'));
    });
    
    /***** HYPERLINK PREVIEW TOOLTIP (inspired by daniels.link) *****/
    const tooltip = document.getElementById('linkTooltip');
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('mouseenter', () => {
        tooltip.innerText = link.href;
        tooltip.classList.add('show');
      });
      link.addEventListener('mouseleave', () => {
        tooltip.classList.remove('show');
      });
      link.addEventListener('mousemove', (e) => {
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = (e.clientY - 20) + 'px';
      });
    });
  </script>
</body>
</html>
