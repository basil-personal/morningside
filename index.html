<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global Reset & Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    /* Main "BASIL ALOMARY" Text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1500;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom Pulsing Cursor (initially white, but will turn black after explosion) */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2000;
    }
    /* Explosion Overlay */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* Initially hidden */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      /* Explosion effect starts as a tiny circle */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Overlay Content Container */
    #overlay-content {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
      font-size: 12px; /* Much smaller text */
      line-height: 1.4;
    }
    /* The normal (bottom) text layer: black text */
    #overlay-normal {
      color: #000;
    }
    /* The inverted (top) text layer: white text, masked by a clip-path */
    #overlay-inverted {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: #fff;
      /* Start with an empty clip-path (no area revealed) */
      clip-path: circle(0px at 0px 0px);
    }
    /* Ensure links inside bio work normally */
    #overlay-normal a, #overlay-inverted a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main Text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom Cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion Overlay -->
  <div id="overlay">
    <div id="overlay-content">
      <div id="overlay-normal"></div>
      <div id="overlay-inverted"></div>
    </div>
  </div>
  
  <script>
    /********************
     * Global Variables & Bio Text
     ********************/
    const bioText = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://www.bain.com" target="_blank">Bain &amp; Company</a> and as the VP of Growth at <a href="https://www.simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
    
    // We'll store the current cursor scale so we know the effective radius.
    let currentCursorScale = 1;
    // We'll track the cursor's position in viewport coordinates.
    let cursorX = 0, cursorY = 0;
    
    /********************
     * Custom Cursor Animation (Big, Growing, Pulsing)
     * Using a sine wave for constant pulsing.
     ********************/
    const cursor = document.getElementById("custom-cursor");
    // Turn the cursor black after explosion is triggered.
    let cursorIsBlack = false;
    let startTime = performance.now();
    
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000; // in seconds
      // Pulse between 1 and 2 (scale factor)
      const pulse = 0.5 * (Math.sin(2 * Math.PI * elapsed) + 1); // ranges 0..1
      const scale = 1 + pulse;  // scale ranges 1 to 2
      currentCursorScale = scale;
      cursor.style.transform = `translate(-50%, -50%) scale(${scale})`;
      
      // If overlay is active, update the clip-path on the inverted text layer.
      if (document.getElementById("overlay").style.display !== "none") {
        updateInvertedClip();
      }
      requestAnimationFrame(animateCursor);
    }
    
    // Update the clip-path of the inverted text layer so that it shows a circle 
    // (centered at the cursor's position relative to the overlay-content).
    function updateInvertedClip() {
      const invertedLayer = document.getElementById("overlay-inverted");
      const content = document.getElementById("overlay-content");
      const rect = content.getBoundingClientRect();
      // Compute cursor position relative to overlay-content.
      const relativeX = cursorX - rect.left;
      const relativeY = cursorY - rect.top;
      // Determine the effective radius of the cursor (base 20px, half width, times scale, times factor).
      const effectiveRadius = (20 * currentCursorScale / 2) * 1.5; // adjust factor as desired
      invertedLayer.style.clipPath = `circle(${effectiveRadius}px at ${relativeX}px ${relativeY}px)`;
    }
    
    // Update cursor position on mouse/touch move.
    document.addEventListener("mousemove", e => {
      cursorX = e.clientX;
      cursorY = e.clientY;
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursorX = e.touches[0].clientX;
      cursorY = e.touches[0].clientY;
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    
    animateCursor();
    
    /********************
     * Explosion & Reveal Animation on Click/Touch
     ********************/
    const textEl = document.getElementById("text");
    textEl.addEventListener("click", triggerExplosion);
    textEl.addEventListener("touchstart", triggerExplosion);
    
    function triggerExplosion(e) {
      // Prevent multiple triggers.
      if (textEl.classList.contains("clicked")) return;
      textEl.classList.add("clicked");
      
      // Get the click/touch coordinates.
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Activate the explosion overlay.
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      // Restart explosion animation.
      void overlay.offsetWidth;
      overlay.classList.add("active");
      
      // Change the custom cursor to black.
      cursor.style.background = "#000";
      cursorIsBlack = true;
      
      // Set the bio text immediately (no scramble effect) in both layers.
      document.getElementById("overlay-normal").innerHTML = bioText;
      document.getElementById("overlay-inverted").innerHTML = bioText;
    }
  </script>
</body>
</html>
