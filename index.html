<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- Include GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* Basic Reset and Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: none; /* Hide the default cursor */
    }
    /* Main Clickable Text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    /* Fade-out Animation for Main Text */
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
    }
    /* Custom Cursor – A white circle that will pulse */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1);
      z-index: 1000;
    }
    /* Overlay for the Eruption Effect */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* Initially hidden */
      align-items: center;
      justify-content: center;
      z-index: 2000;
      pointer-events: none;
      /* Start as a tiny circle at the click/touch point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    /* Activate the eruption animation */
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from {
        clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
      }
      to {
        clip-path: circle(150% at var(--x, 50%) var(--y, 50%));
      }
    }
    /* Overlay Text – Bold, All Caps */
    #overlay-text {
      font-size: 20px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }
    /* Black Falling Screen Element */
    #black-fall {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 3000;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Main Clickable Text -->
  <div id="text">Basil Alomary</div>
  
  <!-- Custom Cursor Element -->
  <div id="custom-cursor"></div>
  
  <!-- Fullscreen Overlay (for Eruption & Text Scramble) -->
  <div id="overlay">
    <div id="overlay-text"></div>
  </div>
  
  <!-- Black Falling Screen Element -->
  <div id="black-fall"></div>
  
  <script>
    // --------------------------
    // Text Scramble Effect Class
    // --------------------------
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.frameRequest = null;
        this.frame = 0;
        this.queue = [];
        this.resolve = null;
        // Multiplier to slow down scramble timing
        this.multiplier = 5; 
        this.update = this.update.bind(this);
      }
      
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          // Random start and end times, multiplied to extend duration.
          const start = Math.floor(Math.random() * 40 * this.multiplier);
          const end = start + Math.floor(Math.random() * 40 * this.multiplier);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0; i < this.queue.length; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span class="dud">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    // ---------------------------
    // Custom Cursor – Position & Dynamic Pulse
    // ---------------------------
    const cursor = document.getElementById("custom-cursor");
    let cursorX = 0, cursorY = 0;
    
    // Helper function to update the cursor position.
    function updateCursorPosition(x, y) {
      cursorX = x;
      cursorY = y;
      cursor.style.left = x + "px";
      cursor.style.top = y + "px";
    }
    
    // Listen for both mouse and touch events.
    document.addEventListener("mousemove", (e) => {
      updateCursorPosition(e.clientX, e.clientY);
    });
    document.addEventListener("touchstart", (e) => {
      updateCursorPosition(e.touches[0].clientX, e.touches[0].clientY);
    });
    document.addEventListener("touchmove", (e) => {
      updateCursorPosition(e.touches[0].clientX, e.touches[0].clientY);
    });
    
    // ---------------------------
    // Animation Loop for Dynamic Pulsing
    // ---------------------------
    const baseScale = 1;
    const defaultAmplitude = 0.2; // default pulse amplitude
    // Use a slower frequency for pulsing (Math.PI gives a 2-second period instead of 1 second)
    const frequency = Math.PI; 
    let startTime = performance.now();
    
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000; // in seconds
      
      // Get the center position of the main text.
      const textEl = document.getElementById("text");
      let centerX = window.innerWidth / 2;
      let centerY = window.innerHeight / 2;
      if (textEl) {
        const rect = textEl.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;
      }
      
      // Calculate the distance between the cursor and the center of the main text.
      const dx = cursorX - centerX;
      const dy = cursorY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      // Determine a multiplier for amplitude based on proximity.
      let amplitudeMultiplier = 1;
      if (distance < 200) {
        amplitudeMultiplier = 1 + ((200 - distance) / 200);
      }
      
      // Compute extra growth so the cursor becomes significantly larger as it nears the text.
      // When within 200px, extraGrowth scales linearly up to an added 2.5.
      let extraGrowth = 0;
      if (distance < 200) {
        extraGrowth = ((200 - distance) / 200) * 2.5;
      }
      
      // Calculate the current scale using a sine wave for pulsing.
      const amplitude = defaultAmplitude * amplitudeMultiplier;
      const pulse = amplitude * Math.sin(elapsed * frequency);
      const scale = baseScale + pulse + extraGrowth;
      
      // Apply the new scale (keeping the translate for centering)
      cursor.style.transform = `translate(-50%, -50%) scale(${scale})`;
      
      requestAnimationFrame(animateCursor);
    }
    animateCursor();
    
    // --------------------------------------------------
    // On Click/Touch: Vanish Main Text, Erupt Overlay, & Scramble Text
    // --------------------------------------------------
    document.getElementById("text").addEventListener("click", triggerAnimation);
    document.getElementById("text").addEventListener("touchstart", triggerAnimation);
    
    function triggerAnimation(e) {
      // Prevent multiple triggers (especially on touch devices)
      if (document.getElementById("text").classList.contains("clicked")) return;
      
      document.getElementById("text").classList.add("clicked");
      
      // Determine event type for coordinate extraction.
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Setup the overlay clip-path center and display it.
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      
      // Hide the custom cursor.
      cursor.style.display = "none";
      
      // Force reflow to restart the eruption animation.
      void overlay.offsetWidth;
      overlay.classList.add("active");
      
      // Run the scramble effect on the overlay text.
      const overlayText = document.getElementById("overlay-text");
      const scramble = new TextScramble(overlayText);
      scramble.setText("WE'LL BE BACK SOON").then(() => {
        // After a short pause, animate the black falling screen.
        setTimeout(() => {
          const blackFall = document.getElementById("black-fall");
          blackFall.style.display = "block";
          gsap.to("#black-fall", {duration: 1, top: 0, ease: "power2.inOut"});
        }, 2000); // 2-second pause after the text appears
      });
    }
  </script>
</body>
</html>
