<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global reset and base styling */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    /* Main "BASIL ALOMARY" text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1500;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff; /* initially white */
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2000;
      /* No outline, just a solid circle */
    }
    /* Overlay container (covers full viewport) */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* will be shown on explosion */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Bio text container – centered, but text inside is left-aligned and very small */
    #overlay-content {
      position: relative;
      max-width: 600px;
      width: 90%;
      margin: 0 auto;
      text-align: left;
      font-size: 10px;
      line-height: 1.4;
      color: #000; /* final normal text color */
    }
    /* Normal (unscrambled) layer: clickable with final HTML (links) */
    #overlay-normal {
      position: relative;
      z-index: 1;
      pointer-events: auto;
    }
    /* Inverted white text layer for x-ray effect */
    #overlay-inverted {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #fff;
      pointer-events: none;
      z-index: 2;
      /* Initially hide by clip-path */
      clip-path: circle(0px at 0px 0px);
    }
    /* Scrambled text layer on top, fades out to reveal underlying layers */
    #overlay-scramble {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #000;
      z-index: 3;
      pointer-events: none;
      opacity: 1;
    }
    /* Ensure hyperlinks in the normal layer are clickable and styled */
    #overlay-normal a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main Text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom Pulsing Cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion Overlay -->
  <div id="overlay">
    <div id="overlay-content">
      <!-- Normal layer with final bio text -->
      <div id="overlay-normal"></div>
      <!-- Inverted (white) text layer for x-ray effect -->
      <div id="overlay-inverted"></div>
      <!-- Scrambled text layer on top -->
      <div id="overlay-scramble"></div>
    </div>
  </div>
  
  <script>
    /********************
     * Global Variables & Bio Text
     ********************/
    const bioHTML = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://bain.com" target="_blank">Bain</a> and as the VP of Growth at <a href="https://simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
    
    // We'll also get a plain text version for scrambling
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = bioHTML;
    const bioPlain = tempDiv.textContent || tempDiv.innerText;
    
    // Utility: Generate scrambled version of a string (preserving spaces and punctuation)
    function scrambleText(text) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let scrambled = "";
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c.match(/[A-Za-z0-9]/)) {
          scrambled += chars[Math.floor(Math.random() * chars.length)];
        } else {
          scrambled += c;
        }
      }
      return scrambled;
    }
    
    /********************
     * Custom Pulsing Cursor Animation
     ********************/
    const cursor = document.getElementById("custom-cursor");
    let cursorX = 0, cursorY = 0;
    let currentCursorScale = 1;
    let cursorIsBlack = false;
    let startTime = performance.now();
    
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000;
      // Pulsing: scale between 1 and 2
      const pulse = 0.5 * (Math.sin(2 * Math.PI * elapsed) + 1);
      const scale = 1 + pulse;
      currentCursorScale = scale;
      cursor.style.transform = `translate(-50%, -50%) scale(${scale})`;
      
      // If overlay is active, update the inverted layer's clip-path
      if (document.getElementById("overlay").style.display !== "none") {
        updateInvertedClip();
      }
      requestAnimationFrame(animateCursor);
    }
    
    // Update the clip-path on the inverted layer (to reveal white text where the cursor is)
    function updateInvertedClip() {
      const invertedLayer = document.getElementById("overlay-inverted");
      const content = document.getElementById("overlay-content");
      const rect = content.getBoundingClientRect();
      const relativeX = cursorX - rect.left;
      const relativeY = cursorY - rect.top;
      // Effective radius: base (10px) * current scale * factor
      const effectiveRadius = (10 * currentCursorScale) * 1.5;
      invertedLayer.style.clipPath = `circle(${effectiveRadius}px at ${relativeX}px ${relativeY}px)`;
    }
    
    // Update cursor position on mouse/touch events
    document.addEventListener("mousemove", e => {
      cursorX = e.clientX;
      cursorY = e.clientY;
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursorX = e.touches[0].clientX;
      cursorY = e.touches[0].clientY;
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    
    animateCursor();
    
    /********************
     * Explosion & Reveal with Scramble Effect
     ********************/
    const textEl = document.getElementById("text");
    textEl.addEventListener("click", triggerExplosion);
    textEl.addEventListener("touchstart", triggerExplosion);
    
    function triggerExplosion(e) {
      if (textEl.classList.contains("clicked")) return;
      textEl.classList.add("clicked");
      
      // Get click/touch coordinates
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Activate explosion overlay
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      void overlay.offsetWidth; // trigger reflow
      overlay.classList.add("active");
      
      // Change cursor to black (solid, no outline)
      cursor.style.background = "#000";
      cursorIsBlack = true;
      
      // Populate the normal and inverted layers with the final bio HTML
      document.getElementById("overlay-normal").innerHTML = bioHTML;
      document.getElementById("overlay-inverted").innerHTML = bioHTML;
      
      // Generate a scrambled version from the plain text and set it in the scramble layer
      const scrambled = scrambleText(bioPlain);
      document.getElementById("overlay-scramble").innerHTML = scrambled;
      
      // After a short delay, fade out the scramble layer to reveal the unscrambled text
      setTimeout(() => {
        // Use CSS transition for opacity (or GSAP if preferred)
        const scrambleLayer = document.getElementById("overlay-scramble");
        scrambleLayer.style.transition = "opacity 2s ease";
        scrambleLayer.style.opacity = "0";
      }, 500);
    }
  </script>
</body>
</html>
