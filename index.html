<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global reset and base styling */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    /* Main "BASIL ALOMARY" text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1500;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;  /* initially white */
      border-radius: 50%;
      border: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2000;
    }
    /* Explosion overlay (covers full viewport) */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* shown on explosion */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      /* Start with a tiny circle at the click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Overlay content container (for bio text) */
    #overlay-content {
      position: relative;
      max-width: 600px;
      width: 90%;
      margin: 0 auto;
      text-align: left;
      font-size: 10px; /* very small text */
      line-height: 1.4;
      color: #000;  /* normal text appears in black */
    }
    /* Normal bio text layer (clickable hyperlinks) */
    #overlay-normal {
      position: relative;
      z-index: 1;
      pointer-events: auto;
    }
    /* Inverted text layer (for x-ray effect) */
    #overlay-inverted {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #fff;
      pointer-events: none;
      z-index: 2;
      /* Initially, no area is revealed */
      clip-path: circle(0px at 0px 0px);
    }
    /* Scrambled text layer on top (for scramble effect) */
    #overlay-scramble {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: #000;
      z-index: 3;
      pointer-events: none;
    }
    /* Ensure hyperlinks in the normal layer work */
    #overlay-normal a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main clickable text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom pulsing cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion overlay containing the bio text layers -->
  <div id="overlay">
    <div id="overlay-content">
      <!-- Normal (black) bio text with clickable hyperlinks -->
      <div id="overlay-normal"></div>
      <!-- Inverted (white) bio text for x-ray effect -->
      <div id="overlay-inverted"></div>
      <!-- Scrambled text layer (initially scrambled and then unscrambles) -->
      <div id="overlay-scramble"></div>
    </div>
  </div>
  
  <script>
    /********************
     * TEXT SCRAMBLE EFFECT CLASS
     * (Based on https://cruip.com/making-a-text-scramble-animation-with-javascript/)
     ********************/
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.update = this.update.bind(this);
      }
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          const start = Math.floor(Math.random() * 40);
          const end = start + Math.floor(Math.random() * 40);
          this.queue.push({ from, to, start, end });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0; i < this.queue.length; i++) {
          let { from, to, start, end } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            output += this.randomChar();
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    /********************
     * GLOBAL VARIABLES & BIO TEXT
     ********************/
    // Final bio text with working hyperlinks
    const bioHTML = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://bain.com" target="_blank">Bain</a> and as the VP of Growth at <a href="https://simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
    
    // Plain text version for scramble effect (removes HTML tags)
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = bioHTML;
    const bioPlain = tempDiv.textContent || tempDiv.innerText;
    
    /********************
     * CUSTOM PULSING CURSOR & X-RAY EFFECT
     ********************/
    const cursor = document.getElementById("custom-cursor");
    let cursorX = 0, cursorY = 0;
    let currentCursorScale = 1;
    let startTime = performance.now();
    
    // Animate the pulsing cursor (grows and shrinks)
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000;
      // Pulse between 1 and 2
      const pulse = 0.5 * (Math.sin(2 * Math.PI * elapsed) + 1);
      const scale = 1 + pulse;
      currentCursorScale = scale;
      cursor.style.transform = `translate(-50%, -50%) scale(${scale})`;
      // Update the inverted layer's clip-path (x-ray effect) if overlay is active
      if (document.getElementById("overlay").style.display !== "none") {
        updateInvertedClip();
      }
      requestAnimationFrame(animateCursor);
    }
    
    // Update clip-path on inverted layer so that a circle (centered on the cursor) reveals white text
    function updateInvertedClip() {
      const invertedLayer = document.getElementById("overlay-inverted");
      const content = document.getElementById("overlay-content");
      const rect = content.getBoundingClientRect();
      const relativeX = cursorX - rect.left;
      const relativeY = cursorY - rect.top;
      // Base radius (10px) scaled by current cursor scale and multiplied by a factor (adjust as needed)
      const effectiveRadius = (10 * currentCursorScale) * 1.5;
      invertedLayer.style.clipPath = `circle(${effectiveRadius}px at ${relativeX}px ${relativeY}px)`;
    }
    
    // Update cursor position on mouse and touch events
    document.addEventListener("mousemove", e => {
      cursorX = e.clientX;
      cursorY = e.clientY;
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursorX = e.touches[0].clientX;
      cursorY = e.touches[0].clientY;
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    
    animateCursor();
    
    /********************
     * EXPLOSION & REVEAL WITH SCRAMBLE EFFECT
     ********************/
    const textEl = document.getElementById("text");
    textEl.addEventListener("click", triggerExplosion);
    textEl.addEventListener("touchstart", triggerExplosion);
    
    function triggerExplosion(e) {
      if (textEl.classList.contains("clicked")) return;
      textEl.classList.add("clicked");
      
      // Get click/touch coordinates
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Activate the explosion overlay
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      void overlay.offsetWidth; // force reflow to restart animation
      overlay.classList.add("active");
      
      // Change the custom cursor to black (solid, no outline)
      cursor.style.background = "#000";
      
      // Populate the normal and inverted layers with the final bio text
      document.getElementById("overlay-normal").innerHTML = bioHTML;
      document.getElementById("overlay-inverted").innerHTML = bioHTML;
      
      // Use the TextScramble class to scramble and then unscramble the bio (using plain text)
      const scrambleEl = document.getElementById("overlay-scramble");
      const fx = new TextScramble(scrambleEl);
      fx.setText(bioPlain).then(() => {
        // Once unscrambled, remove the scramble layer so the clickable normal layer is accessible
        scrambleEl.style.display = "none";
      });
    }
  </script>
</body>
</html>
