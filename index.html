<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- Include GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* Basic Reset and Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
      cursor: none; /* Hide default cursor */
    }
    /* Main Clickable Text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    /* Fade-out Animation for Main Text */
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
    }
    /* Custom Pulsing Cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s infinite;
      z-index: 1000;
    }
    @keyframes pulse {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
      50%  { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    }
    /* Overlay for the Eruption Effect */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* Initially hidden */
      align-items: center;
      justify-content: center;
      z-index: 2000;
      pointer-events: none;
      /* Start as a tiny circle at the click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    /* Activate the eruption animation */
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from {
        clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
      }
      to {
        clip-path: circle(150% at var(--x, 50%) var(--y, 50%));
      }
    }
    /* Overlay Text – Bold, All Caps */
    #overlay-text {
      font-size: 20px;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }
    /* Black Falling Screen Element */
    #black-fall {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 3000;
      display: none;
    }
    /* Cursor Trail Elements for Fantastical Motion Blur */
    .cursor-trail {
      position: fixed;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
    }
    /* Different Radial Gradients for Off-White Shades */
    #trail1 { 
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 60%);
      filter: blur(8px);
    }
    #trail2 { 
      background: radial-gradient(circle, rgba(250,250,250,0.8) 0%, rgba(250,250,250,0) 60%);
      filter: blur(8px);
    }
    #trail3 { 
      background: radial-gradient(circle, rgba(245,245,245,0.8) 0%, rgba(245,245,245,0) 60%);
      filter: blur(8px);
    }
    #trail4 { 
      background: radial-gradient(circle, rgba(240,240,240,0.8) 0%, rgba(240,240,240,0) 60%);
      filter: blur(8px);
    }
    #trail5 { 
      background: radial-gradient(circle, rgba(235,235,235,0.8) 0%, rgba(235,235,235,0) 60%);
      filter: blur(8px);
    }
  </style>
</head>
<body>
  <!-- Main Clickable Text -->
  <div id="text">Basil Alomary</div>
  
  <!-- Custom Cursor Element -->
  <div id="custom-cursor"></div>
  
  <!-- Cursor Trail Elements for a Fantastical Motion Blur -->
  <div class="cursor-trail" id="trail1"></div>
  <div class="cursor-trail" id="trail2"></div>
  <div class="cursor-trail" id="trail3"></div>
  <div class="cursor-trail" id="trail4"></div>
  <div class="cursor-trail" id="trail5"></div>
  
  <!-- Fullscreen Overlay (for Eruption & Text Scramble) -->
  <div id="overlay">
    <div id="overlay-text"></div>
  </div>
  
  <!-- Black Falling Screen Element -->
  <div id="black-fall"></div>
  
  <script>
    // --------------------------
    // Text Scramble Effect Class
    // --------------------------
    class TextScramble {
      constructor(el) {
        this.el = el;
        this.chars = '!<>-_\\/[]{}—=+*^?#________';
        this.frameRequest = null;
        this.frame = 0;
        this.queue = [];
        this.resolve = null;
        // Multiplier to slow down scramble timing
        this.multiplier = 5; 
        this.update = this.update.bind(this);
      }
      
      setText(newText) {
        const oldText = this.el.innerText;
        const length = Math.max(oldText.length, newText.length);
        const promise = new Promise((resolve) => this.resolve = resolve);
        this.queue = [];
        for (let i = 0; i < length; i++) {
          const from = oldText[i] || '';
          const to = newText[i] || '';
          // Random start and end times, multiplied to extend duration.
          const start = Math.floor(Math.random() * 40 * this.multiplier);
          const end = start + Math.floor(Math.random() * 40 * this.multiplier);
          this.queue.push({ from, to, start, end, char: '' });
        }
        cancelAnimationFrame(this.frameRequest);
        this.frame = 0;
        this.update();
        return promise;
      }
      
      update() {
        let output = '';
        let complete = 0;
        for (let i = 0; i < this.queue.length; i++) {
          let { from, to, start, end, char } = this.queue[i];
          if (this.frame >= end) {
            complete++;
            output += to;
          } else if (this.frame >= start) {
            if (!char || Math.random() < 0.28) {
              char = this.randomChar();
              this.queue[i].char = char;
            }
            output += `<span class="dud">${char}</span>`;
          } else {
            output += from;
          }
        }
        this.el.innerHTML = output;
        if (complete === this.queue.length) {
          this.resolve();
        } else {
          this.frameRequest = requestAnimationFrame(this.update);
          this.frame++;
        }
      }
      
      randomChar() {
        return this.chars[Math.floor(Math.random() * this.chars.length)];
      }
    }
    
    // ---------------------------
    // Cursor & Trail Mouse Follow
    // ---------------------------
    document.addEventListener("mousemove", function(e) {
      // Update the main custom cursor position
      const cursor = document.getElementById("custom-cursor");
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
      
      // Use GSAP to animate the trailing elements with slight delays for a smooth motion-blur effect
      gsap.to("#trail1", {duration: 0.2, x: e.clientX, y: e.clientY});
      gsap.to("#trail2", {duration: 0.3, x: e.clientX, y: e.clientY});
      gsap.to("#trail3", {duration: 0.4, x: e.clientX, y: e.clientY});
      gsap.to("#trail4", {duration: 0.5, x: e.clientX, y: e.clientY});
      gsap.to("#trail5", {duration: 0.6, x: e.clientX, y: e.clientY});
    });
    
    // --------------------------------------------------
    // On Click: Vanish Main Text, Erupt Overlay, & Scramble Text
    // --------------------------------------------------
    document.getElementById("text").addEventListener("click", function(e) {
      this.classList.add("clicked");
      
      // Get click coordinates for the eruption origin.
      const x = e.clientX;
      const y = e.clientY;
      
      // Setup the overlay clip-path center and display it.
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", x + "px");
      overlay.style.setProperty("--y", y + "px");
      overlay.style.display = "flex";
      
      // Hide the custom cursor and its trails.
      document.getElementById("custom-cursor").style.display = "none";
      document.querySelectorAll(".cursor-trail").forEach(trail => trail.style.display = "none");
      
      // Force reflow to restart the eruption animation.
      void overlay.offsetWidth;
      overlay.classList.add("active");
      
      // Run the scramble effect on the overlay text.
      const overlayText = document.getElementById("overlay-text");
      const scramble = new TextScramble(overlayText);
      scramble.setText("WE'LL BE BACK SOON").then(() => {
        // After the scramble effect completes, wait a short pause then animate the falling black screen.
        setTimeout(() => {
          const blackFall = document.getElementById("black-fall");
          blackFall.style.display = "block";
          gsap.to("#black-fall", {duration: 1, top: 0, ease: "power2.inOut"});
        }, 2000); // 2-second pause after the text appears
      });
    });
  </script>
</body>
</html>
