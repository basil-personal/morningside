<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil Alomary</title>
  <!-- Import IBM Plex Sans from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- Include GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* Global reset and base styling */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    /* Main "BASIL ALOMARY" text */
    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1500;
    }
    #text.clicked {
      animation: vanish 0.5s forwards;
    }
    @keyframes vanish {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }
    /* Custom pulsing cursor */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background: #fff;  /* initially white */
      border-radius: 50%;
      border: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2000;
    }
    /* Explosion overlay covering full viewport */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none; /* shown on explosion */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      /* Start with a tiny circle at click point */
      clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
    }
    #overlay.active {
      animation: erupt 0.8s forwards;
    }
    @keyframes erupt {
      from { clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); }
      to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
    }
    /* Bio text container: centered but text left-aligned, very small */
    #overlay-content {
      position: relative;
      max-width: 600px;
      width: 90%;
      margin: 0 auto;
      text-align: left;
      font-size: 10px;
      line-height: 1.4;
      color: #000;
      opacity: 0; /* will be animated in */
    }
    /* Normal bio text layer: contains final HTML with working hyperlinks */
    #overlay-normal {
      pointer-events: auto;
    }
    #overlay-normal a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Main clickable text -->
  <div id="text">BASIL ALOMARY</div>
  
  <!-- Custom pulsing cursor -->
  <div id="custom-cursor"></div>
  
  <!-- Explosion overlay -->
  <div id="overlay">
    <div id="overlay-content">
      <div id="overlay-normal"></div>
    </div>
  </div>
  
  <script>
    /********************
     * GLOBAL VARIABLES & BIO TEXT
     ********************/
    const bioHTML = `I'm currently a Principal and the Head of Research &amp; Growth Strategy at <a href="https://stripes.co" target="_blank">Stripes</a>, a NY-based growth equity fund. I lead the team responsible for the diligence and evaluation of Stripes’ investments in consumer and enterprise companies. I also help support our portfolio of #amazing products.<br><br>Prior to Stripes, I spent time as a Consultant at <a href="https://bain.com" target="_blank">Bain</a> and as the VP of Growth at <a href="https://simondata.com" target="_blank">Simon Data</a>. Additionally, I've spent time as an early stage investor and advisor to several companies and funds.`;
    
    /********************
     * CUSTOM PULSING CURSOR
     * - Slower pulsing with a 3-second period.
     * - Dynamic scaling based on distance from center: larger near center, smaller at periphery.
     ********************/
    const cursor = document.getElementById("custom-cursor");
    let cursorX = 0, cursorY = 0;
    let startTime = performance.now();
    // Define min and max scales based on viewport distance
    const minScale = 0.5, maxScale = 2.5;
    const pulsePeriod = 3; // seconds
    function animateCursor() {
      const now = performance.now();
      const elapsed = (now - startTime) / 1000;
      // Determine cursor's distance from center of viewport
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const dx = cursorX - centerX;
      const dy = cursorY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const maxDistance = Math.sqrt(Math.pow(centerX,2) + Math.pow(centerY,2));
      const normalizedDistance = distance / maxDistance; // 0 (center) to 1 (corner)
      // Base scale: larger when closer to center, smaller when farther
      const baseScale = minScale + (maxScale - minScale) * (1 - normalizedDistance);
      // Slow pulsing factor (sine wave with period = pulsePeriod)
      const pulse = 0.5 * (Math.sin((2 * Math.PI / pulsePeriod) * elapsed) + 1); // 0 to 1
      // Final scale: modulate base scale by pulse (amplitude factor set to 0.3)
      const finalScale = baseScale * (1 + 0.3 * pulse);
      cursor.style.transform = `translate(-50%, -50%) scale(${finalScale})`;
      requestAnimationFrame(animateCursor);
    }
    
    // Update cursor position on mouse and touch events
    document.addEventListener("mousemove", e => {
      cursorX = e.clientX;
      cursorY = e.clientY;
      cursor.style.left = e.clientX + "px";
      cursor.style.top  = e.clientY + "px";
    });
    document.addEventListener("touchmove", e => {
      cursorX = e.touches[0].clientX;
      cursorY = e.touches[0].clientY;
      cursor.style.left = e.touches[0].clientX + "px";
      cursor.style.top  = e.touches[0].clientY + "px";
    });
    animateCursor();
    
    /********************
     * EXPLOSION & BIO DROP-IN ANIMATION
     ********************/
    const textEl = document.getElementById("text");
    textEl.addEventListener("click", triggerExplosion);
    textEl.addEventListener("touchstart", triggerExplosion);
    
    function triggerExplosion(e) {
      if (textEl.classList.contains("clicked")) return;
      textEl.classList.add("clicked");
      
      // Get click/touch coordinates
      let clientX, clientY;
      if (e.type.startsWith("touch")) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      // Activate the explosion overlay
      const overlay = document.getElementById("overlay");
      overlay.style.setProperty("--x", clientX + "px");
      overlay.style.setProperty("--y", clientY + "px");
      overlay.style.display = "flex";
      void overlay.offsetWidth; // trigger reflow
      overlay.classList.add("active");
      
      // Change cursor to black immediately (solid, no outline)
      cursor.style.background = "#000";
      
      // Populate the bio text into the overlay
      const overlayNormal = document.getElementById("overlay-normal");
      overlayNormal.innerHTML = bioHTML;
      
      // Animate the drop-in of the bio text from above the viewport
      const overlayContent = document.getElementById("overlay-content");
      gsap.fromTo(overlayContent, 
                    { y: "-100vh", opacity: 0 },
                    { y: "0", opacity: 1, duration: 1, ease: "power2.out", delay: 0.5 });
    }
  </script>
</body>
</html>
